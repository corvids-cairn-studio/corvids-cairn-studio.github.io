title: Corvid's Cairn Studio
url: "https://corvids-cairn-studio.github.io"
baseurl: ""

markdown: kramdown

# Devlog post URLs will look like:
# /devlog/2026/09/12/wave-director-split/
permalink: /devlog/:year/:month/:day/:title/

# Shows 5 posts per page (1 featured + 4 listed). Change the number as you like.
paginate: 5
paginate_path: "/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-feed

# Every file in _posts automatically uses _layouts/post.html
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
